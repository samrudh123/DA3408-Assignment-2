services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: spam-api:cached
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      CACHE_TTL_SECONDS: "300"
    depends_on:
      cache:
        condition: service_healthy
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped
